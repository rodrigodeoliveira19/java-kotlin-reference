#Tue Oct 27 18:16:24 UTC 2026
micronaut.application.name=process-file

datasources.default.url=jdbc:postgresql://localhost:5432/process_file
datasources.default.username=postgres
datasources.default.password=postgres
datasources.default.driver-class-name=org.postgresql.Driver

datasources.default.maximum-pool-size=10
datasources.default.minimum-idle=2

jpa.default.properties.hibernate.hbm2ddl.auto=none
jpa.default.properties.hibernate.show_sql=false
jpa.default.properties.hibernate.format_sql=false
jpa.default.properties.hibernate.jdbc.batch_size=50
jpa.default.properties.hibernate.order_inserts=true
jpa.default.properties.hibernate.order_updates=true
jpa.default.properties.hibernate.jdbc.batch_versioned_data=true

redis.uri=redis://localhost:6379

shedlock.enabled=true
shedlock.name=process-file-import
shedlock.defaults.lock-at-most-for=PT10M
shedlock.defaults.lock-at-least-for=PT30S
#shedlock.lock-at-most-for=PT10M
#shedlock.lock-at-least-for=PT30S

s3.bucket=process-file-uploads
s3.region=us-east-1
s3.scan-interval=PT5M
s3.batch-size=100
s3.prefix.entrada=entrada/
s3.prefix.processamento=processamento/
s3.prefix.processado=processado/
s3.prefix.erro=erro/
